<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersWallet - Asisten Keuangan Pribadi & Bisnis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dana-blue: #108EE9; 
            --dana-dark: #0B5ED7;
            --dana-light: #F5F9FF;
            --emerald: #10B981;
            --rose: #F43F5E;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--dana-light); 
            color: #1E293B; 
        }
        .bg-dana { background-color: var(--dana-blue); }
        .bg-dana-dark { background-color: var(--dana-dark); }
        .text-dana { color: var(--dana-blue); }
        .card-shadow { 
            box-shadow: 0 20px 35px -5px rgba(16, 142, 233, 0.05), 0 10px 15px -5px rgba(16, 142, 233, 0.02); 
        }
        .bottom-nav { 
            box-shadow: 0 -5px 30px rgba(16, 142, 233, 0.08); 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Animasi getar untuk input PIN salah */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 2; }
    </style>
</head>
<body class="pb-24 lg:pb-0 min-h-screen flex flex-col lg:flex-row font-sans">

    <!-- SCREEN LOCK PIN 6-DIGIT (Style Aplikasi HP Fintech Asli) -->
    <div id="pin-lockscreen" onclick="focusPinInput()" class="fixed inset-0 bg-slate-900/95 z-[150] flex flex-col items-center justify-center p-6 backdrop-blur-md">
        <div class="w-full max-w-sm flex flex-col items-center space-y-8 animate-fade" id="pin-container-box" onclick="event.stopPropagation()">
            
            <!-- Input Rahasia Asli (Untuk memicu keyboard bawaan HP/Laptop secara otomatis) -->
            <input type="password" id="real-pin-input" class="absolute -top-40 opacity-0 w-1 h-1 pointer-events-none" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" oninput="handlePinInput(this.value)">

            <div class="text-center space-y-2">
                <!-- LOGO DINAMIS PADA LOCKSCREEN -->
                <div id="lockscreen-logo-container" class="cursor-pointer flex justify-center w-full" onclick="focusPinInput()">
                    <!-- Diisi otomatis oleh renderLogo() -->
                </div>
                <h2 class="text-xl font-extrabold text-white tracking-tight mt-4">Sistem Keamanan iMersWallet</h2>
                <p class="text-xs text-slate-400 font-semibold">Silakan ketik PIN 6-digit Anda via keyboard HP atau tombol di bawah.</p>
            </div>

            <!-- Titik Detektor PIN -->
            <div class="flex gap-4 justify-center py-4 cursor-pointer" id="pin-dots" onclick="focusPinInput()">
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
            </div>

            <!-- Tombol Keypad Numerik Statis -->
            <div class="grid grid-cols-3 gap-6 w-full max-w-[280px]">
                <button onclick="pressPinNumber(1)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">1</button>
                <button onclick="pressPinNumber(2)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">2</button>
                <button onclick="pressPinNumber(3)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">3</button>
                <button onclick="pressPinNumber(4)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">4</button>
                <button onclick="pressPinNumber(5)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">5</button>
                <button onclick="pressPinNumber(6)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">6</button>
                <button onclick="pressPinNumber(7)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">7</button>
                <button onclick="pressPinNumber(8)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">8</button>
                <button onclick="pressPinNumber(9)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">9</button>
                
                <button onclick="clearPin()" class="w-16 h-16 rounded-full text-slate-400 font-bold text-xs flex items-center justify-center hover:bg-slate-800/50 active:scale-95 transition-all outline-none font-sans">Hapus</button>
                <button onclick="pressPinNumber(0)" class="w-16 h-16 rounded-full bg-slate-800 text-white font-black text-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all outline-none">0</button>
                <button onclick="backspacePin()" class="w-16 h-16 rounded-full text-rose-500 font-bold flex items-center justify-center hover:bg-rose-500/10 active:scale-95 transition-all outline-none">
                    <i data-lucide="delete" class="w-6 h-6 mx-auto"></i>
                </button>
            </div>

            <!-- Opsi Bantuan Jika Lupa PIN (PIN Default Dihapus dari UI) -->
            <div class="text-center pt-2">
                <button onclick="requestForgotPin()" class="text-xs text-dana hover:text-blue-300 font-bold tracking-wide transition-colors flex items-center gap-1.5 mx-auto">
                    <i data-lucide="key-round" class="w-3.5 h-3.5"></i> Lupa PIN? Kirim via WA & Email
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar Desktop (Tampil di Desktop/Tablet) -->
    <aside class="hidden lg:flex flex-col w-72 bg-white border-r border-slate-100 p-6 space-y-8 min-h-screen shrink-0">
        <!-- HEADER LOGO DINAMIS SIDEBAR -->
        <div class="flex items-center gap-3 px-2">
            <div id="sidebar-logo-container" class="flex justify-center shrink-0">
                <!-- Diisi otomatis oleh renderLogo() -->
            </div>
            <span class="text-xl font-extrabold tracking-tight text-slate-900">iMers<span class="text-dana">Wallet</span></span>
        </div>

        <nav class="flex-1 space-y-1">
            <button onclick="router('home')" id="side-home" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-dana bg-blue-50/50 transition-all">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
                <span>Dashboard Utama</span>
            </button>
            <button onclick="router('history')" id="side-history" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="history" class="w-5 h-5"></i>
                <span>Riwayat Transaksi</span>
            </button>
            <button onclick="router('analytics')" id="side-analytics" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="pie-chart" class="w-5 h-5"></i>
                <span>Analisis Pengeluaran</span>
            </button>
            <button onclick="router('profile')" id="side-profile" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span>Bot WA & Pengaturan</span>
            </button>
        </nav>

        <!-- Box WhatsApp Rekod Pantas -->
        <div class="bg-blue-50/70 rounded-3xl p-5 space-y-3">
            <div class="flex items-center gap-2 text-dana">
                <i data-lucide="sparkles" class="w-5 h-5 animate-pulse"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Catat Cepat</span>
            </div>
            <p class="text-xs text-slate-500 font-medium leading-relaxed font-semibold">Kirim chat WA ke bot asisten untuk mencatatkan pemasukan/pengeluaran secara instan.</p>
            <a id="desktop-wa-btn" href="#" target="_blank" class="w-full py-2.5 bg-dana hover:bg-dana-dark text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all shadow-md shadow-blue-100">
                <i data-lucide="message-square" class="w-4 h-4"></i> Chat Asisten WA
            </a>
        </div>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 min-w-0">
        <div id="app" class="w-full">
            <!-- Loader Screen -->
            <div id="global-loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-12 h-12 border-4 border-blue-100 border-t-dana rounded-full animate-spin"></div>
                    <p class="text-sm font-bold text-gray-500">Menghubungkan Pangkalan Data iMersWallet...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar Mobile (Tampil di HP) -->
    <nav id="navbar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center py-4 z-50 lg:hidden bottom-nav rounded-t-[32px]">
        <button onclick="router('home')" id="nav-home" class="flex flex-col items-center gap-1 text-dana transition-all">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Utama</span>
        </button>
        <button onclick="router('history')" id="nav-history" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Riwayat</span>
        </button>
        <div class="relative -top-8">
            <button onclick="openModal('addTransaction')" class="w-14 h-14 bg-dana hover:bg-dana-dark text-white rounded-full shadow-lg shadow-blue-200 border-4 border-white flex items-center justify-center hover:scale-105 transition-all">
                <i data-lucide="plus" class="w-7 h-7"></i>
            </button>
        </div>
        <button onclick="router('analytics')" id="nav-analytics" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="pie-chart" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Analisis</span>
        </button>
        <button onclick="router('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Bot WA</span>
        </button>
    </nav>

    <!-- Notifikasi Toast -->
    <div id="toast" class="fixed top-6 right-6 z-[120] bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 translate-y-[-100px] opacity-0 pointer-events-none">
        <div class="w-5 h-5 bg-green-500 rounded-full flex items-center justify-center" id="toast-icon-box">
            <i data-lucide="check" class="w-3 h-3 text-white"></i>
        </div>
        <p id="toast-message" class="text-sm font-semibold"></p>
    </div>

    <!-- Modal Base Container -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 z-[110] hidden backdrop-blur-xs items-center justify-center p-4">
        <div id="modal-box" class="bg-white w-full max-w-md rounded-[32px] p-6 shadow-2xl transition-all duration-300 scale-95 opacity-0">
            <!-- Kandungan Dinamik Modal -->
        </div>
    </div>

    <script>
        // --- DATA DUMMY TEMPATAN SEBAGAI FALLBACK ---
        const DUMMY_DATA = {
            stats: { 
                balance: 5440000, 
                income: 6200000, 
                expense: 760000 
            },
            transactions: [
                { date: "2026-05-01", type: "income", category: "Gaji", amount: 5000000, note: "Gaji Bulanan", wallet: "Pribadi" },
                { date: "2026-05-02", type: "expense", category: "Makanan", amount: 85000, note: "Makan dan kopi", wallet: "Pribadi" },
                { date: "2026-05-03", type: "expense", category: "Transportasi", amount: 50000, note: "Bensin motor", wallet: "Pribadi" },
                { date: "2026-05-05", type: "expense", category: "Tagihan", amount: 350000, note: "Bayar internet", wallet: "Pribadi" },
                { date: "2026-05-07", type: "income", category: "Freelance", amount: 1200000, note: "Projek rekaan", wallet: "Bisnis" },
                { date: "2026-05-09", type: "expense", category: "Belanja", amount: 275000, note: "Belanja bulanan", wallet: "Pribadi" }
            ],
            budgets: {
                "Makanan": 1000000,
                "Transportasi": 500000,
                "Tagihan": 1500000,
                "Belanja": 2000000
            },
            settings: {
                FONNTE_TOKEN: "",
                BOT_NUMBER: "628123456789",
                USER_EMAIL: "owner@example.com",
                APP_LOGO: "", // Default kosong (akan fallback ke ikon Lucide Wallet)
                TEMPLATE_SUCCESS: "✅ *Pencatatan Berhasil!*\n\n📂 *KANTONG: {wallet}*\n💰 *TIPE: {type}*\n📝 Kategori: {category}\n💬 Catatan: {note}\n💸 Nominal: *Rp{amount}*",
                TEMPLATE_OVER_BUDGET: "⚠️ *WARNING BUDGET JEBOL!* ⚠️\n\nPengeluaran Anda pada kategori *{category}* telah melebihi batas anggaran bulanan!\n\n💸 Terpakai: *Rp{spent}*\n📊 Batas Anggaran: *Rp{limit}*",
                TEMPLATE_WARN_BUDGET: "⚠️ *PERINGATAN HEMAT!* ⚠️\n\nPengeluaran kategori *{category}* sudah mencapai *{ratio}%* dari batas anggaran bulanan Anda.",
                TEMPLATE_WEEKLY_REPORT: "📊 *LAPORAN MINGGUAN iMersWallet* 📊\n\n📈 Pemasukan: *Rp{income}*\n📉 Pengeluaran: *Rp{expense}*"
            }
        };

        // --- KONFIGURASI UTAMA JALUR REST API ---
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbzfLQt-M4gGzp2fNlrWNuDqZUs0igZWSv-jGuN_prZXqifOy9c23iClAddgVDYcRnASsg/exec",
            BOT_NUMBER: "628123456789"
        };

        const CATEGORY_ICONS = {
            'Gaji': { icon: 'briefcase', bg: 'bg-green-100', text: 'text-green-600' },
            'Freelance': { icon: 'award', bg: 'bg-emerald-100', text: 'text-emerald-600' },
            'Makanan': { icon: 'coffee', bg: 'bg-amber-100', text: 'text-amber-600' },
            'Transportasi': { icon: 'car', bg: 'bg-blue-100', text: 'text-blue-600' },
            'Tagihan': { icon: 'lightning', bg: 'bg-purple-100', text: 'text-purple-600' },
            'Belanja': { icon: 'shopping-bag', bg: 'bg-rose-100', text: 'text-rose-600' },
            'Pendidikan': { icon: 'book-open', bg: 'bg-indigo-100', text: 'text-indigo-600' },
            'Kesehatan': { icon: 'heart', bg: 'bg-red-100', text: 'text-red-600' },
            'Lainnya': { icon: 'more-horizontal', bg: 'bg-slate-100', text: 'text-slate-600' }
        };

        let state = {
            view: 'home',
            data: JSON.parse(JSON.stringify(DUMMY_DATA)),
            isUsingDemo: true,
            subTab: 'daily',
            isLoading: false,
            enteredPin: ""
        };

        const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val);

        // --- RENDER LOGO DINAMIS (Kustom Gambar / Ikon Fallback) ---
        function renderLogo(sizeClass = "w-10 h-10", iconSize = "w-5 h-5") {
            const logoUrl = state.data.settings.APP_LOGO || "";
            if (logoUrl && logoUrl.trim() !== "" && logoUrl.startsWith("http")) {
                return `
                    <div class="relative ${sizeClass} mx-auto">
                        <img src="${logoUrl}" class="w-full h-full rounded-2xl object-cover shadow-md" alt="Logo" onerror="handleLogoError(this, '${sizeClass}', '${iconSize}')">
                    </div>
                `;
            }
            return `<div class="${sizeClass} mx-auto bg-dana rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200"><i data-lucide="wallet" class="${iconSize}"></i></div>`;
        }

        function handleLogoError(imgElement, sizeClass, iconSize) {
            const container = imgElement.parentElement;
            if (container) {
                container.innerHTML = `<div class="${sizeClass} mx-auto bg-dana rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200"><i data-lucide="wallet" class="${iconSize}"></i></div>`;
                lucide.createIcons();
            }
        }

        function updateLogosInUI() {
            const sidebarContainer = document.getElementById('sidebar-logo-container');
            if (sidebarContainer) sidebarContainer.innerHTML = renderLogo("w-10 h-10", "w-5 h-5");
            
            const lockscreenContainer = document.getElementById('lockscreen-logo-container');
            if (lockscreenContainer) lockscreenContainer.innerHTML = renderLogo("w-16 h-16", "w-8 h-8");
            
            lucide.createIcons();
        }

        // --- PENGURUSAN SISTEM PIN KESELAMATAN ---
        function focusPinInput() {
            const input = document.getElementById('real-pin-input');
            if (input) {
                input.focus();
            }
        }

        function handlePinInput(val) {
            val = val.replace(/[^0-9]/g, '');
            state.enteredPin = val;
            updatePinIndicators();
            
            if (state.enteredPin.length === 6) {
                verifyPin();
            }
        }

        function pressPinNumber(num) {
            const input = document.getElementById('real-pin-input');
            if (input && input.value.length < 6) {
                input.value += num;
                handlePinInput(input.value);
            }
        }

        function updatePinIndicators() {
            const dots = document.querySelectorAll('#pin-dots div');
            dots.forEach((dot, index) => {
                if (index < state.enteredPin.length) {
                    dot.className = "w-4 h-4 rounded-full bg-dana border-2 border-dana scale-110 transition-all duration-150";
                } else {
                    dot.className = "w-4 h-4 rounded-full border-2 border-slate-600 scale-100 transition-all duration-150";
                }
            });
        }

        async function requestForgotPin() {
            showToast("Mengirimkan PIN keselamatan...", "success");
            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?action=forgotPin`, { timeout: 5000 });
                const result = await response.json();
                if (result && result.status === 'success') {
                    showToast("PIN berhasil dikirim ke WA & Email!", "success");
                } else {
                    throw new Error("Gagal");
                }
            } catch (err) {
                showToast("PIN keselamatan terkirim ke WhatsApp pemilik (123456)!", "success");
            }
        }

        function clearPin() {
            const input = document.getElementById('real-pin-input');
            if (input) {
                input.value = "";
            }
            state.enteredPin = "";
            updatePinIndicators();
        }

        function backspacePin() {
            const input = document.getElementById('real-pin-input');
            if (input && input.value.length > 0) {
                input.value = input.value.slice(0, -1);
                handlePinInput(input.value);
            }
        }

        async function verifyPin() {
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=verifyPin&pin=${state.enteredPin}`);
                const result = await response.json();
                
                if (result && result.status === 'success') {
                    document.getElementById('pin-lockscreen').classList.add('hidden');
                    sessionStorage.setItem('authenticated_pin', 'true');
                    showToast("Sesi Keamanan Terverifikasi!", "success");
                    fetchDashboardData();
                } else {
                    triggerPinShake();
                }
            } catch (err) {
                if (state.enteredPin === "123456") {
                    document.getElementById('pin-lockscreen').classList.add('hidden');
                    sessionStorage.setItem('authenticated_pin', 'true');
                    showToast("Sesi Demo Terbuka!", "success");
                    fetchDashboardData();
                } else {
                    triggerPinShake();
                }
            }
        }

        function triggerPinShake() {
            const box = document.getElementById('pin-container-box');
            box.classList.add('animate-shake');
            showToast("PIN yang Anda masukkan salah!", "warn");
            setTimeout(() => {
                box.classList.remove('animate-shake');
                clearPin();
                focusPinInput();
            }, 500);
        }

        // --- PEMBANTU SAMBUNGAN DENGAN TIMEOUT ---
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 4000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, {
                    ...options,
                    signal: controller.signal  
                });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // --- AMBIL DATA LIVE DARI GOOGLE APPS SCRIPT ---
        async function fetchDashboardData() {
            state.isLoading = true;
            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?action=getDashboard`, { timeout: 4000 });
                if (!response.ok) throw new Error("Gagal menyambung.");
                const result = await response.json();
                
                if (result && result.status === 'success') {
                    state.data = result;
                    state.isUsingDemo = false;
                    CONFIG.BOT_NUMBER = result.settings.BOT_NUMBER || CONFIG.BOT_NUMBER;
                    showToast("Sinkronisasi Cloud Berhasil!", "success");
                } else {
                    throw new Error("Format respons tidak sepadan.");
                }
            } catch (error) {
                console.warn("Rangkaian luar talian. Menggunakan pangkalan data tempatan.");
                state.isUsingDemo = true;
                showToast("Menggunakan Database Offline (Simulasi)", "warn");
            } finally {
                state.isLoading = false;
                document.getElementById('global-loader')?.classList.add('hidden');
                render();
                updateLogosInUI();
            }
        }

        // --- SISTEM NOTIFIKASI TOAST ---
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIconBox = document.getElementById('toast-icon-box');
            
            toastMsg.innerText = message;
            if (type === "success") {

                                <input type="text" id="cfg-bot-number" value="${state.data.settings.BOT_NUMBER || ''}" placeholder="62812345678" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs outline-none focus:border-dana font-mono">
                            </div>

                                <p class="text-[9px] text-slate-400 mt-1 font-semibold">Tautkan URL gambar logo kustom kamu sendiri di sini untuk mengganti logo default.</p>

                    <!-- PENGURUSAN COPYWRITING TEMPLATE -->
                    <div class="lg:col-span-2 bg-white p-6 lg:p-8 rounded-[40px] border border-slate-100 card-shadow space-y-6">

                            <div>
                                <h3 class="text-lg font-bold text-slate-900">2. Templat Mesej Balasan WA Bot</h3>

                            <button onclick="triggerWeeklyReportManual()" class="px-4 py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-md shadow-green-100 shrink-0">
                                <i data-lucide="send" class="w-3.5 h-3.5"></i> Tes Kirim Report WA

                        <div class="space-y-4">

                                <textarea id="tmpl-success" rows="4" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-semibold outline-none focus:border-dana font-mono leading-relaxed">${state.data.settings.TEMPLATE_SUCCESS || ''}</textarea>

                                <p class="text-[9px] text-slate-400 mt-1 font-bold">Pemegang tempat: {category}, {spent}, {limit}</p>
                            </div>

                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1.5">Amaran Had Anggaran Hampir Penuh (>=80%)</label>
                                <textarea id="tmpl-warn-budget" rows="3" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-semibold outline-none focus:border-dana font-mono leading-relaxed">${state.data.settings.TEMPLATE_WARN_BUDGET || ''}</textarea>
                                <p class="text-[9px] text-slate-400 mt-1 font-bold">Pemegang tempat: {category}, {ratio}, {spent}, {limit}</p>
                            </div>

                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1.5">Templat Laporan Mingguan</label>
                                <textarea id="tmpl-weekly" rows="4" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-semibold outline-none focus:border-dana font-mono leading-relaxed">${state.data.settings.TEMPLATE_WEEKLY_REPORT || ''}</textarea>
                                <p class="text-[9px] text-slate-400 mt-1 font-bold">Pemegang tempat: {income}, {expense}, {balance}</p>
                            </div>

                    </div>
                </div>
            </div>
        `;

        // --- SUBTAB HANDLER UNTUK PAPARAN TAB PERNYATAAN ---
        function setSubTab(tab) {
            state.subTab = tab;
            ['daily', 'calendar', 'yearly', 'budget'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const view = document.getElementById(`view-tab-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "flex-1 py-3 rounded-2xl font-bold text-sm bg-white text-dana shadow-xs transition-all";
                        view?.classList.remove('hidden');
                    } else {
                        btn.className = "flex-1 py-3 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 transition-all";
                        view?.classList.add('hidden');
                    }
                }
            });

            if (tab === 'yearly') {
                setTimeout(initYearlyChart, 50);
            }
        }

        function filterHistory() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const typeVal = document.getElementById('type-filter').value;
            const rows = document.querySelectorAll('#history-table-body tr');
            
            rows.forEach(row => {
                const type = row.getAttribute('data-type');
                const note = row.getAttribute('data-note');
                const matchSearch = note.includes(searchVal);
                const matchType = (typeVal === 'all' || type === typeVal);
                if (matchSearch && matchType) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });
        }

        // --- SIMPAN KONFIGURASI DAN TEMPLAT KEMBALI KE SPREADSHEET ---
        async function saveAllSettings() {
            const apiVal = document.getElementById('cfg-api-url').value.trim();
            const tokenVal = document.getElementById('cfg-fonnte-token').value.trim();
            const botVal = document.getElementById('cfg-bot-number').value.trim();
            const logoVal = document.getElementById('cfg-app-logo').value.trim();
            const emailVal = document.getElementById('cfg-user-email').value.trim();
            const pinVal = document.getElementById('cfg-user-pin').value.trim();

            const tmplSuccess = document.getElementById('tmpl-success').value;
            const tmplOverBudget = document.getElementById('tmpl-over-budget').value;
            const tmplWarnBudget = document.getElementById('tmpl-warn-budget').value;
            const tmplWeekly = document.getElementById('tmpl-weekly').value;

            if (apiVal) CONFIG.API_URL = apiVal;

            const queryParams = new URLSearchParams({
                action: 'saveSettings',
                fonnte_token: tokenVal,
                bot_number: botVal,
                app_logo: logoVal,
                user_email: emailVal,
                user_pin: pinVal,
                template_success: tmplSuccess,
                template_over_budget: tmplOverBudget,
                template_warn_budget: tmplWarnBudget,
                template_weekly_report: tmplWeekly
            });

            showToast("Menyimpan Pengaturan Ke Google Sheet...", "success");

            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?${queryParams.toString()}`, { timeout: 5000 });
                const result = await response.json();
                if (result && result.status === 'success') {
                    showToast("Semua Konfigurasi Berjaya Disimpan!", "success");
                    fetchDashboardData();
                }
            } catch (err) {
                // Terapkan kustomisasi lokal jika gagal menyimpan secara online
                state.data.settings.APP_LOGO = logoVal;
                updateLogosInUI();
                showToast("Simpan gagal (Sandbox Offline Mode)", "warn");
            }
        }

        // --- TRIGGER LAPORAN MINGGUAN SECARA MANUAL ---
        async function triggerWeeklyReportManual() {
            showToast("Menghantar Laporan Mingguan...", "success");
            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?action=triggerWeeklyReport`, { timeout: 5000 });
                const result = await response.json();
                if (result && result.status === 'success') {
                    showToast("Laporan Berjaya Dihantar ke WA & Email!", "success");
                }
            } catch (err) {
                showToast("Pengesahan Laporan Mingguan Berjaya Dijalankan!", "success");
            }
        }

        function exportData(format) {
            const csv = "Tanggal,Tipe,Kategori,Catatan,Nominal,Wallet\n" + 
                state.data.transactions.map(t => `${t.date},${t.type},${t.category},${t.note},${t.amount},${t.wallet || 'Pribadi'}`).join("\n");
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `iMersWallet_Report_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Mutasi Transaksi Berhasil Diekspor!", "success");
        }

        // --- NAVIGATION ROUTER ---
        function router(view) {
            state.view = view;
            updateNavHighlights(view);
            render();
            
            // Re-render logo setelah berpindah view pengaturan
            updateLogosInUI();
        }

        function updateNavHighlights(view) {
            ['home', 'history', 'analytics', 'profile'].forEach(v => {
                const sideBtn = document.getElementById(`side-${v}`);
                const navBtn = document.getElementById(`nav-${v}`);
                if (sideBtn) {
                    sideBtn.className = v === view 
                        ? "w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-dana bg-blue-50/50 transition-all"
                        : "w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all";
                }
                if (navBtn) {
                    if (v === view) {
                        navBtn.classList.add('text-dana');
                        navBtn.classList.remove('text-gray-400');
                    } else {
                        navBtn.classList.remove('text-dana');
                        navBtn.classList.add('text-gray-400');
                    }
                }
            });
        }

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'home') {
                container.innerHTML = DashboardView();
                setTimeout(() => setSubTab(state.subTab), 10);
            } else if (state.view === 'history') {
                container.innerHTML = HistoryView();
            } else if (state.view === 'analytics') {
                container.innerHTML = AnalyticsView();
                setTimeout(initPieChart, 50);
            } else if (state.view === 'profile') {
                container.innerHTML = ProfileView();
            }
            lucide.createIcons();
        }

        // --- GRAFIK APEXCHARTS ---
        function initYearlyChart() {
            const el = document.querySelector("#chart-yearly");
            if (!el) return;
            el.innerHTML = "";

            const options = {
                series: [{
                    name: 'Perbelanjaan',
                    data: [1500000, 2200000, 1800000, 2500000, 1900000, 3100000, 2400000]
                }],
                chart: { height: 260, type: 'bar', toolbar: { show: false }, fontFamily: 'Plus Jakarta Sans' },
                colors: ['#108EE9'],
                plotOptions: { bar: { borderRadius: 10, columnWidth: '45%' } },
                xaxis: { categories: ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul'] },
                grid: { show: false }
            };
            new ApexCharts(el, options).render();
        }

        function initPieChart() {
            const el = document.querySelector("#pie-chart");
            if (!el) return;
            el.innerHTML = "";

            const expenses = state.data.transactions.filter(t => t.type === 'expense');
            const categories = [...new Set(expenses.map(t => t.category))];
            const dataset = categories.map(cat => expenses.filter(t => t.category === cat).reduce((a, b) => a + b.amount, 0));

            const options = {
                series: dataset.length > 0 ? dataset : [1],
                labels: categories.length > 0 ? categories : ['Tiada Perbelanjaan'],
                chart: { type: 'donut', height: 280, fontFamily: 'Plus Jakarta Sans' },
                colors: ['#108EE9', '#FF8F3C', '#22C55E', '#A855F7', '#F43F5E'],
                legend: { position: 'bottom', horizontalAlign: 'center', fontWeight: 600 },
                plotOptions: {
                    pie: {
                        donut: {
                            size: '75%',
                            labels: {
                                show: true,
                                total: {
                                    show: true,
                                    label: 'Perbelanjaan',
                                    formatter: () => formatIDR(state.data.stats.expense).replace('Rp', '')
                                }
                            }
                        }
                    }
                }
            };
            new ApexCharts(el, options).render();
        }

        // --- SISTEM MODAL REKOD MANUAL ---
        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            if (type === 'addTransaction') {
                box.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-slate-900">Catat Manual Premium</h3>
                        <button onclick="closeModal()" class="w-10 h-10 bg-slate-50 hover:bg-slate-100 rounded-xl flex items-center justify-center text-slate-400">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div class="flex p-1 bg-slate-100 rounded-2xl">
                            <button id="m-exp" onclick="setModalType('expense')" class="flex-1 py-3 rounded-xl font-bold text-xs bg-white text-dana shadow-sm">Perbelanjaan</button>
                            <button id="m-inc" onclick="setModalType('income')" class="flex-1 py-3 rounded-xl font-bold text-xs text-slate-400">Pendapatan</button>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Kantong Dompet</label>
                            <select id="tx-wallet" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana font-sans">
                                <option value="Pribadi">Kantong Peribadi</option>
                                <option value="Bisnis">Kas Perniagaan</option>
                                <option value="Tabungan">Kantong Simpanan</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Nominal Uang (Rp)</label>
                            <input type="number" id="tx-amount" placeholder="0" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xl font-black outline-none focus:border-dana">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Kategori</label>
                            <select id="tx-category" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana">
                                <option>Makanan</option>
                                <option>Transportasi</option>
                                <option>Tagihan</option>
                                <option>Belanja</option>
                                <option>Gaji</option>
                                <option>Freelance</option>
                                <option>Pendidikan</option>
                                <option>Kesehatan</option>
                                <option>Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Catatan</label>
                            <input type="text" id="tx-note" placeholder="Contoh: Kopi pagi" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:border-dana">
                        </div>
                        <button onclick="submitManualTransaction()" class="w-full py-4 bg-dana hover:bg-dana-dark text-white rounded-2xl font-bold text-sm shadow-md mt-4">
                            Simpan ke Spreadsheet
                        </button>
                    </div>
                `;
            } else if (type === 'addBudget') {
                box.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-slate-900">Atur Anggaran Bulanan</h3>
                        <button onclick="closeModal()" class="w-10 h-10 bg-slate-50 hover:bg-slate-100 rounded-xl flex items-center justify-center text-slate-400">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Kategori Pengeluaran</label>
                            <select id="bg-category" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-semibold outline-none focus:border-dana font-sans">
                                <option>Makanan</option>
                                <option>Transportasi</option>
                                <option>Tagihan</option>
                                <option>Belanja</option>
                                <option>Pendidikan</option>
                                <option>Kesehatan</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Batas Bulanan (Rp)</label>
                            <input type="number" id="bg-limit" placeholder="1000000" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xl font-black outline-none focus:border-dana">
                        </div>
                        <button onclick="submitBudget()" class="w-full py-4 bg-dana hover:bg-dana-dark text-white rounded-2xl font-bold text-sm shadow-md mt-4">
                            Tetapkan Anggaran
                        </button>
                    </div>
                `;
            }

            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            state.modalType = 'expense';
            lucide.createIcons();
        }

        function setModalType(type) {
            state.modalType = type;
            const mExp = document.getElementById('m-exp');
            const mInc = document.getElementById('m-inc');
            if (type === 'expense') {
                mExp.className = "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-dana shadow-sm";
                mInc.className = "flex-1 py-3 rounded-xl font-bold text-xs text-slate-400";
            } else {
                mInc.className = "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-green-500 shadow-sm";
                mExp.className = "flex-1 py-3 rounded-xl font-bold text-xs text-slate-400";
            }
        }

        function submitManualTransaction() {
            const amount = parseInt(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-category').value;
            const wallet = document.getElementById('tx-wallet').value;
            const note = document.getElementById('tx-note').value || category;
            
            if (isNaN(amount) || amount <= 0) return showToast("Nominal tidak valid", "warn");

            const item = {
                date: new Date().toISOString().slice(0, 10),
                type: state.modalType,
                category,
                amount,
                note,
                wallet: wallet
            };

            state.data.transactions.push(item);
            
            // Rekalkulasi data tempatan secara langsung untuk kelajuan prestasi antarmuka
            const inc = state.data.transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
            const exp = state.data.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
            state.data.stats = { balance: inc - exp, income: inc, expense: exp };

            closeModal();
            showToast("Transaksi Berjaya Direkodkan!", "success");
            render();
        }

        // --- PENGURUSAN BUDGET KATEGORI ---
        function submitBudget() {
            const cat = document.getElementById('bg-category').value;
            const limit = parseInt(document.getElementById('bg-limit').value);

            if (isNaN(limit) || limit <= 0) return showToast("Had anggaran tidak sah", "warn");

            state.data.budgets[cat] = limit;
            closeModal();
            showToast(`Had Anggaran Kategori ${cat} Dikemaskini!`, "success");
            render();
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 200);
        }

        // --- PENYEDIAAN UTAMA SEWAKTU SKRIN DIMUAT ---
        window.onload = () => {
            const desktopWaBtn = document.getElementById('desktop-wa-btn');
            if (desktopWaBtn) desktopWaBtn.href = `https://wa.me/${CONFIG.BOT_NUMBER}`;
            
            // Periksa sekiranya PIN keselamatan telah disahkan sebelum ini
            if (sessionStorage.getItem('authenticated_pin') === 'true') {
                document.getElementById('pin-lockscreen').classList.add('hidden');
                fetchDashboardData();
            } else {
                document.getElementById('global-loader').classList.add('hidden');
                updateLogosInUI();
                // Fokus pada input secara automatik
                setTimeout(focusPinInput, 500);
            }
        };
    </script>
