<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersWallet - Modern Fintech Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --dana-blue: #108EE9; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F5F9FF; color: #1E293B; }
        .bg-dana { background-color: var(--dana-blue); }
        .text-dana { color: var(--dana-blue); }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(16, 142, 233, 0.05), 0 10px 10px -5px rgba(16, 142, 233, 0.02); }
        .bottom-nav { box-shadow: 0 -5px 20px rgba(0,0,0,0.03); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="pb-24 lg:pb-0">

    <div id="app">
        <!-- Loader Screen -->
        <div id="global-loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
            <div class="flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-blue-100 border-t-dana rounded-full animate-spin"></div>
                <p class="text-sm font-bold text-gray-400">Menghubungkan ke Database...</p>
            </div>
        </div>
    </div>

    <nav id="navbar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around items-center py-4 z-50 lg:hidden hidden bottom-nav">
        <button onclick="router('home')" id="nav-home" class="flex flex-col items-center gap-1 text-dana transition-all">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button onclick="router('history')" id="nav-history" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">Riwayat</span>
        </button>
        <div class="relative -top-8">
            <button onclick="openModal()" class="w-14 h-14 bg-dana text-white rounded-full shadow-lg shadow-blue-200 border-4 border-white flex items-center justify-center hover:scale-110 transition-transform">
                <i data-lucide="plus" class="w-8 h-8"></i>
            </button>
        </div>
        <button onclick="router('analytics')" id="nav-analytics" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="trending-up" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">Analisa</span>
        </button>
        <button onclick="router('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">Profil</span>
        </button>
    </nav>

    <script>
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbzfLQt-M4gGzp2fNlrWNuDqZUs0igZWSv-jGuN_prZXqifOy9c23iClAddgVDYcRnASsg/exec",
            CURRENCY: "IDR"
        };

        let state = {
            view: 'landing',
            data: {
                stats: { balance: 0, income: 0, expense: 0 },
                transactions: []
            },
            isLoading: false
        };

        const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val);

        async function fetchDashboardData() {
            state.isLoading = true;
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=getDashboard`);
                const result = await response.json();
                state.data = result;
                render();
            } catch (error) {
                console.error("Fetch error:", error);
                // Fallback to demo data if API fails
            } finally {
                state.isLoading = false;
                document.getElementById('global-loader')?.classList.add('hidden');
            }
        }

        const LandingView = () => `
            <div class="bg-white min-h-screen">
                <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
                    <div class="flex items-center gap-2">
                        <div class="w-10 h-10 bg-dana rounded-xl flex items-center justify-center text-white shadow-lg"><i data-lucide="wallet"></i></div>
                        <span class="text-xl font-black">iMers<span class="text-dana">Wallet</span></span>
                    </div>
                    <button onclick="router('home')" class="px-6 py-2 bg-dana text-white rounded-full font-bold">Mulai Dashboard</button>
                </nav>
                <div class="px-6 py-20 text-center space-y-8 animate-fade">
                    <h1 class="text-5xl lg:text-7xl font-black leading-tight text-slate-900">Catat Keuangan <br><span class="text-dana">Lewat WhatsApp.</span></h1>
                    <p class="text-slate-400 max-w-lg mx-auto text-lg">Asisten finansial pribadi Anda yang terintegrasi dengan WhatsApp. Cepat, Mudah, dan Modern.</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="router('home')" class="px-8 py-4 bg-dana text-white rounded-2xl font-bold shadow-xl shadow-blue-200">Buka Dashboard Gratis</button>
                        <a href="https://wa.me/YOUR_BOT_NUMBER" target="_blank" class="px-8 py-4 bg-white border border-slate-200 text-slate-700 rounded-2xl font-bold flex items-center justify-center gap-2">
                            <i data-lucide="message-circle" class="text-green-500"></i> Coba di WhatsApp
                        </a>
                    </div>
                </div>
            </div>
        `;

        const DashboardView = () => `
            <div class="max-w-6xl mx-auto p-4 lg:p-10 space-y-8 animate-fade">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Status Keuangan</p>
                        <h2 class="text-2xl font-black">Ringkasan Anda 👋</h2>
                    </div>
                    <div class="w-12 h-12 bg-white rounded-2xl border border-slate-100 flex items-center justify-center text-dana card-shadow">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                    </div>
                </div>

                <!-- Balance Card -->
                <div class="bg-dana rounded-[40px] p-8 text-white relative overflow-hidden card-shadow">
                    <div class="relative z-10 space-y-8">
                        <div>
                            <p class="text-blue-100 font-medium opacity-80">Total Saldo Aktif</p>
                            <h1 class="text-4xl lg:text-5xl font-black mt-2">${formatIDR(state.data.stats.balance)}</h1>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-md border border-white/10">
                                <p class="text-[10px] uppercase font-black text-blue-100 mb-1">Pemasukan</p>
                                <p class="text-lg font-bold">${formatIDR(state.data.stats.income)}</p>
                            </div>
                            <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-md border border-white/10">
                                <p class="text-[10px] uppercase font-black text-blue-100 mb-1">Pengeluaran</p>
                                <p class="text-lg font-bold">${formatIDR(state.data.stats.expense)}</p>
                            </div>
                        </div>
                    </div>
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Recent Transactions -->
                    <div class="bg-white p-8 rounded-[40px] border border-slate-50 card-shadow">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-black">Riwayat Terakhir</h3>
                            <button class="text-xs font-bold text-dana">Lihat Semua</button>
                        </div>
                        <div class="space-y-5">
                            ${state.data.transactions.length > 0 ? state.data.transactions.map(t => `
                                <div class="flex items-center justify-between group">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 ${t.type === 'income' ? 'bg-green-50 text-green-500' : 'bg-red-50 text-red-500'} rounded-2xl flex items-center justify-center">
                                            <i data-lucide="${t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <p class="font-bold text-slate-900">${t.category}</p>
                                            <p class="text-[10px] text-slate-400 font-bold uppercase">${t.note}</p>
                                        </div>
                                    </div>
                                    <p class="font-black ${t.type === 'income' ? 'text-green-500' : 'text-slate-900'}">
                                        ${t.type === 'income' ? '+' : '-'}${formatIDR(t.amount).replace('Rp', '')}
                                    </p>
                                </div>
                            `).join('') : '<p class="text-center py-10 text-slate-400 font-medium">Belum ada transaksi</p>'}
                        </div>
                    </div>

                    <!-- Simple Chart -->
                    <div class="bg-white p-8 rounded-[40px] border border-slate-50 card-shadow">
                        <h3 class="text-lg font-black mb-6">Analisa Mingguan</h3>
                        <div id="main-chart" class="min-h-[250px]"></div>
                    </div>
                </div>
            </div>
        `;

        function router(view) {
            state.view = view;
            if (view === 'home') {
                fetchDashboardData();
            }
            render();
        }

        function render() {
            const container = document.getElementById('app');
            const nav = document.getElementById('navbar');
            
            if (state.view === 'landing') {
                container.innerHTML = LandingView();
                nav.classList.add('hidden');
            } else if (state.view === 'home') {
                container.innerHTML = DashboardView();
                nav.classList.remove('hidden');
                setTimeout(initChart, 100);
            }
            
            lucide.createIcons();
        }

        function initChart() {
            const chartEl = document.querySelector("#main-chart");
            if (!chartEl) return;
            
            const options = {
                series: [{ name: 'Cashflow', data: [31, 40, 28, 51, 42, 109, 100] }],
                chart: { height: 250, type: 'area', toolbar: { show: false }, fontFamily: 'Plus Jakarta Sans' },
                colors: ['#108EE9'],
                fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.3, opacityTo: 0 } },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 4 },
                xaxis: { categories: ["S", "S", "R", "K", "J", "S", "M"], axisBorder: { show: false } },
                yaxis: { show: false },
                grid: { show: false }
            };
            new ApexCharts(chartEl, options).render();
        }

        window.onload = () => {
            render();
            // Start loading data if already at home
            if (state.view === 'landing') {
                document.getElementById('global-loader')?.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
