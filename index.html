<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMersWallet - Your Personal & Business Financial Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dana-blue: #108EE9; 
            --dana-dark: #0B5ED7;
            --dana-light: #F5F9FF;
            --emerald: #10B981;
            --rose: #F43F5E;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--dana-light); 
            color: #1E293B; 
        }
        .bg-dana { background-color: var(--dana-blue); }
        .bg-dana-dark { background-color: var(--dana-dark); }
        .text-dana { color: var(--dana-blue); }
        .card-shadow { 
            box-shadow: 0 20px 35px -5px rgba(16, 142, 233, 0.05), 0 10px 15px -5px rgba(16, 142, 233, 0.02); 
        }
        .bottom-nav { 
            box-shadow: 0 -5px 30px rgba(16, 142, 233, 0.08); 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="pb-24 lg:pb-0 min-h-screen flex flex-col lg:flex-row font-sans">

    <!-- Desktop Sidebar (Tampil di Desktop) -->
    <aside class="hidden lg:flex flex-col w-72 bg-white border-r border-slate-100 p-6 space-y-8 min-h-screen shrink-0">
        <div class="flex items-center gap-3 px-2">
            <div class="w-10 h-10 bg-dana rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                <i data-lucide="wallet" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tight text-slate-900">iMers<span class="text-dana">Wallet</span></span>
        </div>

        <nav class="flex-1 space-y-1">
            <button onclick="router('home')" id="side-home" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-dana bg-blue-50/50 transition-all">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
                <span>Dashboard Utama</span>
            </button>
            <button onclick="router('history')" id="side-history" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="history" class="w-5 h-5"></i>
                <span>Riwayat Transaksi</span>
            </button>
            <button onclick="router('analytics')" id="side-analytics" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="pie-chart" class="w-5 h-5"></i>
                <span>Analisa Pengeluaran</span>
            </button>
            <button onclick="router('profile')" id="side-profile" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl font-bold text-sm text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span>WhatsApp Bot & Profil</span>
            </button>
        </nav>

        <!-- WhatsApp Info Box -->
        <div class="bg-blue-50/70 rounded-3xl p-5 space-y-3">
            <div class="flex items-center gap-2 text-dana">
                <i data-lucide="sparkles" class="w-5 h-5 animate-pulse"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Mencatat Instan</span>
            </div>
            <p class="text-xs text-slate-500 font-medium leading-relaxed font-semibold">Kirim chat WA untuk catat instan ke Kantong Pribadi atau Bisnis Anda.</p>
            <a id="desktop-wa-btn" href="#" target="_blank" class="w-full py-2.5 bg-dana hover:bg-dana-dark text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all shadow-md shadow-blue-100">
                <i data-lucide="message-square" class="w-4 h-4"></i> Chat Bot WA
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0">
        <div id="app" class="w-full">
            <!-- Loader Screen -->
            <div id="global-loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-12 h-12 border-4 border-blue-100 border-t-dana rounded-full animate-spin"></div>
                    <p class="text-sm font-bold text-gray-500">Menghubungkan Database iMersWallet...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation (Tampil di HP) -->
    <nav id="navbar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center py-4 z-50 lg:hidden bottom-nav rounded-t-[32px]">
        <button onclick="router('home')" id="nav-home" class="flex flex-col items-center gap-1 text-dana transition-all">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Home</span>
        </button>
        <button onclick="router('history')" id="nav-history" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Riwayat</span>
        </button>
        <div class="relative -top-8">
            <button onclick="openModal('addTransaction')" class="w-14 h-14 bg-dana hover:bg-dana-dark text-white rounded-full shadow-lg shadow-blue-200 border-4 border-white flex items-center justify-center hover:scale-105 transition-all">
                <i data-lucide="plus" class="w-7 h-7"></i>
            </button>
        </div>
        <button onclick="router('analytics')" id="nav-analytics" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="pie-chart" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Analisa</span>
        </button>
        <button onclick="router('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[9px] font-bold">Bot WA</span>
        </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 right-6 z-[120] bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 translate-y-[-100px] opacity-0 pointer-events-none">
        <div class="w-5 h-5 bg-green-500 rounded-full flex items-center justify-center" id="toast-icon-box">
            <i data-lucide="check" class="w-3 h-3 text-white"></i>
        </div>
        <p id="toast-message" class="text-sm font-semibold"></p>
    </div>

    <!-- Modal Base Container -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 z-[110] hidden backdrop-blur-xs items-center justify-center p-4">
        <div id="modal-box" class="bg-white w-full max-w-md rounded-[32px] p-6 shadow-2xl transition-all duration-300 scale-95 opacity-0">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <script>
        // --- DUMMY DATA SEBAGAI FALLBACK JIKA KONEKSI INTERNET / CORS TERBLOCK DI SANDBOX ---
        const DUMMY_DATA = {
            stats: { 
                balance: 5440000, 
                income: 6200000, 
                expense: 760000 
            },
            transactions: [
                { date: "2026-05-01", type: "income", category: "Gaji", amount: 5000000, note: "Gaji Bulanan", wallet: "Pribadi" },
                { date: "2026-05-02", type: "expense", category: "Makanan", amount: 85000, note: "Makan dan kopi", wallet: "Pribadi" },
                { date: "2026-05-03", type: "expense", category: "Transportasi", amount: 50000, note: "Bensin motor", wallet: "Pribadi" },
                { date: "2026-05-05", type: "expense", category: "Tagihan", amount: 350000, note: "Bayar internet", wallet: "Pribadi" },
                { date: "2026-05-07", type: "income", category: "Freelance", amount: 1200000, note: "Project desain", wallet: "Bisnis" },
                { date: "2026-05-09", type: "expense", category: "Belanja", amount: 275000, note: "Belanja bulanan", wallet: "Pribadi" }
            ],
            budgets: {
                "Makanan": 1000000,
                "Transportasi": 500000,
                "Tagihan": 1500000,
                "Belanja": 2000000
            }
        };

        // --- APP CONFIGURATION ---
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbzfLQt-M4gGzp2fNlrWNuDqZUs0igZWSv-jGuN_prZXqifOy9c23iClAddgVDYcRnASsg/exec",
            BOT_NUMBER: "628123456789"
        };

        // Kategori Icons Mapping untuk UI Premium
        const CATEGORY_ICONS = {
            'Gaji': { icon: 'briefcase', bg: 'bg-green-100', text: 'text-green-600' },
            'Freelance': { icon: 'award', bg: 'bg-emerald-100', text: 'text-emerald-600' },
            'Makanan': { icon: 'coffee', bg: 'bg-amber-100', text: 'text-amber-600' },
            'Transportasi': { icon: 'car', bg: 'bg-blue-100', text: 'text-blue-600' },
            'Tagihan': { icon: 'lightning', bg: 'bg-purple-100', text: 'text-purple-600' },
            'Belanja': { icon: 'shopping-bag', bg: 'bg-rose-100', text: 'text-rose-600' },
            'Pendidikan': { icon: 'book-open', bg: 'bg-indigo-100', text: 'text-indigo-600' },
            'Kesehatan': { icon: 'heart', bg: 'bg-red-100', text: 'text-red-600' },
            'Lainnya': { icon: 'more-horizontal', bg: 'bg-slate-100', text: 'text-slate-600' }
        };

        let state = {
            view: 'home',
            data: JSON.parse(JSON.stringify(DUMMY_DATA)), // Diinisialisasi dengan dummy data agar tidak kosong saat awal loading
            isUsingDemo: true, // Status penanda apakah menggunakan demo atau live data
            subTab: 'daily', // Filter Tab Aktif: daily, calendar, yearly, budget
            isLoading: false
        };

        const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val);

        // --- FETCH WITH TIMEOUT HELPER ---
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 4000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, {
                    ...options,
                    signal: controller.signal  
                });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // --- FETCH LIVE SINKRONISASI GOOGLE APPS SCRIPT ---
        async function fetchDashboardData() {
            state.isLoading = true;
            try {
                const response = await fetchWithTimeout(`${CONFIG.API_URL}?action=getDashboard`, { timeout: 4000 });
                if (!response.ok) throw new Error("Gagal mengambil data.");
                const result = await response.json();
                
                if (result && result.status === 'success') {
                    state.data = result;
                    state.isUsingDemo = false;
                    showToast("Database Sinkron Real-time!", "success");
                } else {
                    throw new Error("Format respons API tidak sesuai.");
                }
            } catch (error) {
                console.warn("Koneksi API diabaikan/gagal. Menggunakan database lokal.");
                
                // Rollback ke database dummy lokal yang lengkap agar UI tetap berfungsi optimal
                state.data = JSON.parse(JSON.stringify(DUMMY_DATA));
                state.isUsingDemo = true;
                
                showToast("Menggunakan Database Demo (Offline)", "warn");
            } finally {
                state.isLoading = false;
                document.getElementById('global-loader')?.classList.add('hidden');
                render();
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIconBox = document.getElementById('toast-icon-box');
            
            toastMsg.innerText = message;
            if (type === "success") {
                toastIconBox.className = "w-5 h-5 bg-green-500 rounded-full flex items-center justify-center shrink-0";
                toastIconBox.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-white"></i>`;
            } else {
                toastIconBox.className = "w-5 h-5 bg-amber-500 rounded-full flex items-center justify-center shrink-0";
                toastIconBox.innerHTML = `<i data-lucide="alert-circle" class="w-3 h-3 text-white"></i>`;
            }
            
            lucide.createIcons();
            toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // --- TEMPLATE VIEWS ---
        const DashboardView = () => {
            const stats = state.data.stats;
            
            // Hitung saldo dompet secara dinamis untuk personal & bisnis owner
            const walletPribadi = state.data.transactions
                .filter(t => t.wallet === 'Pribadi')
                .reduce((acc, t) => t.type === 'income' ? acc + t.amount : acc - t.amount, 0);

            const walletBisnis = state.data.transactions
                .filter(t => t.wallet === 'Bisnis')
                .reduce((acc, t) => t.type === 'income' ? acc + t.amount : acc - t.amount, 0);

            const walletTabungan = state.data.transactions
                .filter(t => t.wallet === 'Tabungan')
                .reduce((acc, t) => t.type === 'income' ? acc + t.amount : acc - t.amount, 0);

            // Render Banner Status Koneksi API Google Sheets
            const connectionBanner = state.isUsingDemo ? `
                <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-3xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs animate-fade">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-100 rounded-2xl flex items-center justify-center text-amber-600 shrink-0">
                            <i data-lucide="info" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm">Mode Demo Aktif (Offline)</h4>
                            <p class="text-xs text-amber-700/90 font-semibold">Tautan API Sheets belum merespon atau CORS diblokir. Menggunakan data spreadsheet lokal bawaan.</p>
                        </div>
                    </div>
                    <button onclick="fetchDashboardData()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition-all self-start sm:self-auto shrink-0">
                        Hubungkan Ulang API
                    </button>
                </div>
            ` : `
                <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-3xl p-4 flex items-center gap-3 shadow-xs animate-fade">
                    <div class="w-10 h-10 bg-emerald-100 rounded-2xl flex items-center justify-center text-emerald-600">
                        <i data-lucide="cloud-lightning" class="w-5 h-5 animate-pulse"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-sm">Terhubung dengan Cloud Database</h4>
                        <p class="text-xs text-emerald-700/90 font-semibold">Sinkronisasi data Google Sheets berhasil dilakukan secara real-time.</p>
                    </div>
                </div>
            `;

            return `
                <div class="max-w-6xl mx-auto p-4 lg:p-10 space-y-8 animate-fade">
                    
                    <!-- Alert Status Koneksi -->
                    ${connectionBanner}

                    <!-- Top Summary Header -->
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-1">DANA DOMPET SAYA</p>
                            <h2 class="text-2xl font-black text-slate-900">Ringkasan Finansial 👋</h2>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="fetchDashboardData()" class="w-12 h-12 bg-white rounded-2xl border border-slate-100 flex items-center justify-center text-slate-500 hover:text-dana hover:bg-slate-50 card-shadow transition-all" title="Refresh Data">
                                <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                            </button>
                            <button onclick="router('profile')" class="w-12 h-12 bg-white rounded-2xl border border-slate-100 flex items-center justify-center text-dana card-shadow transition-all">
                                <i data-lucide="message-square" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Fintech Balance Card -->
                    <div class="bg-dana rounded-[36px] p-8 text-white relative overflow-hidden card-shadow">
                        <div class="relative z-10 space-y-8">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-blue-100 font-semibold opacity-80">Total Saldo Aktif</p>
                                    <h1 class="text-4xl lg:text-5xl font-extrabold mt-1 tracking-tight">${formatIDR(stats.balance)}</h1>
                                </div>
                                <span class="px-4 py-1.5 bg-white/20 rounded-full text-xs font-bold backdrop-blur-md flex items-center gap-1">
                                    <span class="w-2 h-2 ${state.isUsingDemo ? 'bg-amber-400' : 'bg-emerald-400'} rounded-full"></span> 
                                    ${state.isUsingDemo ? 'Mode Offline' : 'Sinkronisasi Cloud'}
                                </span>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white/10 p-5 rounded-3xl backdrop-blur-md border border-white/10">
                                    <p class="text-[10px] uppercase font-bold text-blue-100 mb-1.5 tracking-wider">Pemasukan Bulan Ini</p>
                                    <p class="text-lg lg:text-xl font-extrabold">${formatIDR(stats.income)}</p>
                                </div>
                                <div class="bg-white/10 p-5 rounded-3xl backdrop-blur-md border border-white/10">
                                    <p class="text-[10px] uppercase font-bold text-blue-100 mb-1.5 tracking-wider">Pengeluaran Bulan Ini</p>
                                    <p class="text-lg lg:text-xl font-extrabold">${formatIDR(stats.expense)}</p>
                                </div>
                            </div>
                        </div>
                        <div class="absolute -right-20 -top-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
                        <div class="absolute -left-20 -bottom-20 w-64 h-64 bg-blue-400/20 rounded-full blur-2xl"></div>
                    </div>

                    <!-- MULTI-WALLET: KANTONG PREFERENSI (Pribadi, Bisnis, Tabungan) -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-extrabold text-slate-400 uppercase tracking-wider">Kantong Alokasi Keuangan</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <!-- Kantong Pribadi -->
                            <div class="bg-white p-6 rounded-[28px] border border-slate-100 card-shadow flex items-center justify-between group cursor-pointer hover:border-blue-200 transition-all">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-blue-50 text-dana rounded-2xl flex items-center justify-center shrink-0">
                                        <i data-lucide="user" class="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-slate-400 uppercase">Kantong Pribadi</p>
                                        <h4 class="text-lg font-extrabold text-slate-900 mt-1">${formatIDR(walletPribadi)}</h4>
                                    </div>
                                </div>
                                <div class="text-slate-300 group-hover:text-dana transition-colors">
                                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </div>
                            </div>

                            <!-- Kas Bisnis -->
                            <div class="bg-white p-6 rounded-[28px] border border-slate-100 card-shadow flex items-center justify-between group cursor-pointer hover:border-emerald-200 transition-all">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center shrink-0">
                                        <i data-lucide="briefcase" class="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-slate-400 uppercase">Kas Bisnis / Usaha</p>
                                        <h4 class="text-lg font-extrabold text-slate-900 mt-1">${formatIDR(walletBisnis)}</h4>
                                    </div>
                                </div>
                                <div class="text-slate-300 group-hover:text-emerald-500 transition-colors">
                                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </div>
                            </div>

                            <!-- Kantong Tabungan -->
                            <div class="bg-white p-6 rounded-[28px] border border-slate-100 card-shadow flex items-center justify-between group cursor-pointer hover:border-purple-200 transition-all">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-purple-50 text-purple-500 rounded-2xl flex items-center justify-center shrink-0">
                                        <i data-lucide="piggy-bank" class="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-slate-400 uppercase">Kantong Tabungan</p>
                                        <h4 class="text-lg font-extrabold text-slate-900 mt-1">${formatIDR(walletTabungan)}</h4>
                                    </div>
                                </div>
                                <div class="text-slate-300 group-hover:text-purple-500 transition-colors">
                                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- HIGHLY FEATURE-RICH TABS (Daily, Calendar, Yearly, Budget) -->
                    <div class="bg-white rounded-[32px] border border-slate-100 card-shadow overflow-hidden">
                        <div class="flex border-b border-slate-100 bg-slate-50/50 p-2">
                            <button onclick="setSubTab('daily')" class="flex-1 py-3 rounded-2xl font-bold text-sm transition-all ${state.subTab === 'daily' ? 'bg-white text-dana shadow-xs' : 'text-slate-400 hover:text-slate-600'}" id="tab-btn-daily">Harian</button>
                            <button onclick="setSubTab('calendar')" class="flex-1 py-3 rounded-2xl font-bold text-sm transition-all ${state.subTab === 'calendar' ? 'bg-white text-dana shadow-xs' : 'text-slate-400 hover:text-slate-600'}" id="tab-btn-calendar">Kalender</button>
                            <button onclick="setSubTab('yearly')" class="flex-1 py-3 rounded-2xl font-bold text-sm transition-all ${state.subTab === 'yearly' ? 'bg-white text-dana shadow-xs' : 'text-slate-400 hover:text-slate-600'}" id="tab-btn-yearly">Tahunan</button>
                            <button onclick="setSubTab('budget')" class="flex-1 py-3 rounded-2xl font-bold text-sm transition-all ${state.subTab === 'budget' ? 'bg-white text-dana shadow-xs' : 'text-slate-400 hover:text-slate-600'}" id="tab-btn-budget">Budget</button>
                        </div>

                        <div class="p-6">
                            <!-- TAB: DAILY -->
                            <div id="view-tab-daily" class="${state.subTab === 'daily' ? '' : 'hidden'} space-y-5 animate-fade">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 class="font-bold text-slate-900">Arus Kas Harian</h3>
                                    <span class="text-xs text-slate-400 font-semibold">${state.data.transactions.length} Transaksi Terdaftar</span>
                                </div>
                                <div class="space-y-4">
                                    ${state.data.transactions.length > 0 ? state.data.transactions.slice(-6).reverse().map(t => {

        function filterHistory() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const typeVal = document.getElementById('type-filter').value;
            const rows = document.querySelectorAll('#history-table-body tr');
            
            rows.forEach(row => {
                const type = row.getAttribute('data-type');
                const note = row.getAttribute('data-note');
                const matchSearch = note.includes(searchVal);
                const matchType = (typeVal === 'all' || type === typeVal);
                if (matchSearch && matchType) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });
        }

        function saveSettings() {
            const url = document.getElementById('cfg-api-url').value.trim();
            if (url) {
                CONFIG.API_URL = url;
                showToast("URL API Google Sheets Diperbarui!", "success");
                fetchDashboardData();
            }
        }

        function exportData(format) {
            const csv = "Tanggal,Tipe,Kategori,Catatan,Nominal,Wallet\n" + 
                state.data.transactions.map(t => `${t.date},${t.type},${t.category},${t.note},${t.amount},${t.wallet || 'Pribadi'}`).join("\n");
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `iMersWallet_Report_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Mutasi Transaksi Berhasil Diekspor!", "success");
        }

                                <option>Tagihan</option>
                                <option>Belanja</option>
                                <option>Pendidikan</option>
                                <option>Kesehatan</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-2">Batas Bulanan (Rp)</label>
                            <input type="number" id="bg-limit" placeholder="1000000" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-xl font-black outline-none focus:border-dana">
                        </div>
                        <button onclick="submitBudget()" class="w-full py-4 bg-dana hover:bg-dana-dark text-white rounded-2xl font-bold text-sm shadow-md mt-4">
                            Tetapkan Anggaran
                        </button>
                    </div>
                `;
            }

            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            state.modalType = 'expense';
            lucide.createIcons();
        }

        function setModalType(type) {
            state.modalType = type;
            const mExp = document.getElementById('m-exp');
            const mInc = document.getElementById('m-inc');
            if (type === 'expense') {
                mExp.className = "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-dana shadow-sm";
                mInc.className = "flex-1 py-3 rounded-xl font-bold text-xs text-slate-400";
            } else {
                mInc.className = "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-green-500 shadow-sm";
                mExp.className = "flex-1 py-3 rounded-xl font-bold text-xs text-slate-400";
            }
        }

        function submitManualTransaction() {
            const amount = parseInt(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-category').value;
            const wallet = document.getElementById('tx-wallet').value;
            const note = document.getElementById('tx-note').value || category;
            
            if (isNaN(amount) || amount <= 0) return showToast("Nominal tidak valid", "warn");

            const item = {
                date: new Date().toISOString().slice(0, 10),
                type: state.modalType,
                category,
                amount,
                note,
                wallet: wallet
            };

            state.data.transactions.push(item);
            
            // Re-kalkulasi lokal instan demi user experience yang cepat
            const inc = state.data.transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
            const exp = state.data.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
            state.data.stats = { balance: inc - exp, income: inc, expense: exp };

            closeModal();
            showToast("Transaksi Berhasil Disimpan!", "success");
            render();
        }

        function submitBudget() {
            const cat = document.getElementById('bg-category').value;
            const limit = parseInt(document.getElementById('bg-limit').value);

            if (isNaN(limit) || limit <= 0) return showToast("Limit budget tidak valid", "warn");

            state.data.budgets[cat] = limit;
            closeModal();
            showToast(`Budget Kategori ${cat} Diperbarui!`, "success");
            render();
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 200);
        }

        // --- LOAD INITIALIZATION ---
        window.onload = () => {
            const desktopWaBtn = document.getElementById('desktop-wa-btn');
            if (desktopWaBtn) desktopWaBtn.href = `https://wa.me/${CONFIG.BOT_NUMBER}`;
            
            // Panggil API dynamic sync database dari Google Sheets
            fetchDashboardData();
        };
    </script>
</body>
</html>
